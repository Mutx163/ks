<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>管理后台 - 城科卷王</title>
        <link rel="stylesheet" href="css/base.css" />
        <link rel="stylesheet" href="css/home.css" />
        <style>
            .admin-container { max-width: 960px; margin: 0 auto; padding: var(--space-4); }
            .admin-header { text-align: center; margin-bottom: var(--space-6); }
            .admin-header h1 { font-size: var(--font-size-2xl); font-weight: 700; }
            .admin-header p { color: var(--text-secondary); }
            .admin-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: var(--space-3); margin-bottom: var(--space-6); }
            .admin-stat { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-4); text-align: center; }
            .admin-stat-value { font-size: var(--font-size-2xl); font-weight: 700; color: var(--primary); }
            .admin-stat-label { font-size: var(--font-size-sm); color: var(--text-secondary); margin-top: 4px; }
            .admin-table { width: 100%; border-collapse: collapse; font-size: var(--font-size-sm); }
            .admin-table th { background: var(--bg-hover); padding: 10px 12px; text-align: left; font-weight: 600; position: sticky; top: 0; }
            .admin-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
            .admin-table tr:hover td { background: var(--bg-hover); }
            .admin-table .actions { display: flex; gap: 6px; }
            .admin-table .actions button { padding: 4px 8px; font-size: 11px; }
            .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
            .badge-admin { background: var(--primary-light); color: var(--primary); }
            .badge-normal { background: var(--bg-hover); color: var(--text-tertiary); }
            .search-bar { display: flex; gap: 8px; margin-bottom: var(--space-4); }
            .search-bar input { flex: 1; }
            .detail-panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-4); margin-bottom: var(--space-4); display: none; }
            .detail-panel.show { display: block; }
            .detail-panel h3 { margin-bottom: var(--space-3); }
            .detail-close { float: right; cursor: pointer; color: var(--text-tertiary); font-size: 18px; }
            .loading { text-align: center; padding: 40px; color: var(--text-secondary); }
        </style>
    </head>
    <body>
        <header class="home-header">
            <div class="container">
                <div class="home-logo">
                    <div class="home-logo-text">
                        <h1>城科卷王</h1>
                        <p>管理后台</p>
                    </div>
                </div>
                <div class="home-actions">
                    <button class="btn btn-ghost btn-sm" onclick="location.href='index.html'">首页</button>
                </div>
            </div>
        </header>

        <main class="admin-container">
            <div id="admin-content">
                <div class="loading">加载中...</div>
            </div>
        </main>

        <script type="module">
            import API from './js/api.js';
            import Utils from './js/utils.js';

            const Admin = {
                users: [],

                async init() {
                    if (!API.isRegistered()) {
                        document.getElementById('admin-content').innerHTML = '<div class="loading">请先注册账号</div>';
                        return;
                    }

                    const data = await API.request(`/api/admin/users?deviceId=${API.getDeviceId()}`);
                    if (!data || !data.ok) {
                        document.getElementById('admin-content').innerHTML = '<div class="loading">⚠️ 无管理员权限</div>';
                        return;
                    }

                    this.users = data.users;
                    this.render();
                },

                render() {
                    const totalUsers = this.users.length;
                    const totalAnswered = this.users.reduce((s, u) => s + u.total_answered, 0);
                    const totalDuration = this.users.reduce((s, u) => s + u.total_duration, 0);

                    document.getElementById('admin-content').innerHTML = `
                        <div class="admin-header">
                            <h1>📊 管理后台</h1>
                            <p>共 ${totalUsers} 个用户</p>
                        </div>

                        <div class="admin-stats">
                            <div class="admin-stat">
                                <div class="admin-stat-value">${totalUsers}</div>
                                <div class="admin-stat-label">总用户</div>
                            </div>
                            <div class="admin-stat">
                                <div class="admin-stat-value">${totalAnswered}</div>
                                <div class="admin-stat-label">总答题</div>
                            </div>
                            <div class="admin-stat">
                                <div class="admin-stat-value">${this.formatDuration(totalDuration)}</div>
                                <div class="admin-stat-label">总时长</div>
                            </div>
                        </div>

                        <div id="detail-panel" class="detail-panel"></div>

                        <div class="search-bar">
                            <input type="text" id="search-input" placeholder="搜索同步码或姓名..." oninput="Admin.filter()">
                        </div>

                        <div style="overflow-x: auto;">
                            <table class="admin-table">
                                <thead>
                                    <tr>
                                        <th>同步码</th>
                                        <th>姓名</th>
                                        <th>设备</th>
                                        <th>答题数</th>
                                        <th>正确率</th>
                                        <th>时长</th>
                                        <th>注册时间</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="user-table"></tbody>
                            </table>
                        </div>
                    `;

                    this.renderTable(this.users);
                },

                renderTable(users) {
                    const myId = API.getSyncCode();
                    const tbody = document.getElementById('user-table');
                    tbody.innerHTML = users.map(u => {
                        const accuracy = u.total_answered > 0 ? Math.round(u.total_correct / u.total_answered * 100) : 0;
                        const isAdmin = u.is_admin;
                        const isMe = u.id === myId;
                        return `
                            <tr>
                                <td><code>${u.id}</code></td>
                                <td>${Utils.escapeHtml(u.initials)} ${isAdmin ? '<span class="badge badge-admin">管理员</span>' : ''} ${isMe ? '<span class="badge badge-normal">我</span>' : ''}</td>
                                <td>${u.device_count}</td>
                                <td>${u.total_answered}</td>
                                <td>${accuracy}%</td>
                                <td>${this.formatDuration(u.total_duration)}</td>
                                <td>${u.created_at?.slice(0, 10) || '-'}</td>
                                <td class="actions">
                                    <button class="btn btn-ghost btn-sm" onclick="Admin.detail('${u.id}')">详情</button>
                                    ${!isAdmin ? `<button class="btn btn-ghost btn-sm" onclick="Admin.resetStats('${u.id}', '${u.initials}')" style="color:var(--warning)">重置</button>` : ''}
                                    ${!isMe && !isAdmin ? `<button class="btn btn-ghost btn-sm" onclick="Admin deleteUser('${u.id}', '${u.initials}')" style="color:var(--danger)">删除</button>` : ''}
                                </td>
                            </tr>
                        `;
                    }).join('');
                },

                filter() {
                    const q = document.getElementById('search-input').value.toUpperCase();
                    const filtered = this.users.filter(u =>
                        u.id.includes(q) || u.initials.toUpperCase().includes(q)
                    );
                    this.renderTable(filtered);
                },

                async detail(userId) {
                    const data = await API.request(`/api/admin/user-detail/${userId}?deviceId=${API.getDeviceId()}`);
                    if (!data || !data.ok) return;

                    const panel = document.getElementById('detail-panel');
                    panel.classList.add('show');
                    panel.innerHTML = `
                        <span class="detail-close" onclick="this.parentElement.classList.remove('show')">×</span>
                        <h3>${Utils.escapeHtml(data.user.initials)} (${data.user.id})</h3>
                        <p><b>设备数:</b> ${data.devices.length}</p>
                        <p><b>设备ID:</b></p>
                        <ul>${data.devices.map(d => `<li><code style="font-size:11px">${d.device_id}</code> (${d.bound_at?.slice(0, 10)})</li>`).join('')}</ul>
                        <p><b>题库数据:</b></p>
                        <ul>${data.stats.map(s => `<li>${Utils.escapeHtml(s.bank_name || s.bank_id)}: ${s.answered}题, 正确${s.correct}, ${this.formatDuration(s.duration)}</li>`).join('')}</ul>
                    `;
                },

                async resetStats(userId, name) {
                    if (!confirm(`确定重置 ${name} 的所有答题数据？`)) return;
                    const data = await API.request('/api/admin/reset-stats', {
                        method: 'POST',
                        body: JSON.stringify({ deviceId: API.getDeviceId(), targetUserId: userId })
                    });
                    if (data?.ok) {
                        Utils.showToast('已重置', 'success');
                        this.init();
                    }
                },

                async deleteUser(userId, name) {
                    if (!confirm(`确定永久删除用户 ${name} (${userId})？此操作不可恢复！`)) return;
                    const data = await API.request('/api/admin/delete-user', {
                        method: 'POST',
                        body: JSON.stringify({ deviceId: API.getDeviceId(), targetUserId: userId })
                    });
                    if (data?.ok) {
                        Utils.showToast('已删除', 'success');
                        this.init();
                    }
                },

                formatDuration(s) {
                    if (!s || s < 60) return (s || 0) + '秒';
                    if (s < 3600) return Math.floor(s / 60) + '分';
                    return Math.floor(s / 3600) + '时' + Math.floor((s % 3600) / 60) + '分';
                }
            };

            window.Admin = Admin;
            Admin.init();
        </script>
        <script src="js/debug.js"></script>
    </body>
</html>
