<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>管理后台 - 城科卷王</title>

        <!-- DNS 预解析 -->
        <link rel="dns-prefetch" href="https://ks-api.mutx.ccwu.cc" />
        <link rel="preconnect" href="https://ks-api.mutx.ccwu.cc" crossorigin />
        <link rel="dns-prefetch" href="https://unpkg.com" />

        <link rel="stylesheet" href="css/base.css" />
        <link rel="stylesheet" href="css/admin.css" />
        <script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js" defer></script>
    </head>
    <body>
        <!-- 登录页 -->
        <div class="login-page" id="login-page">
            <div class="login-card">
                <div class="logo-icon">KS</div>
                <div class="login-kicker">Production Admin</div>
                <h2>城科卷王管理台</h2>
                <p>题库、用户与运营数据管理中心</p>
                <div class="input-group">
                    <label for="admin-password" class="sr-only">管理密码</label>
                    <span class="ic" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
                    <input
                        type="password"
                        id="admin-password"
                        placeholder="请输入管理密码"
                        autocomplete="off"
                        aria-required="true"
                    />
                </div>
                <div class="login-remember-row">
                    <label class="login-remember-label">
                        <input type="checkbox" id="remember-me" checked />
                        <span>记住我（7天）</span>
                    </label>
                </div>
                <button class="btn-login" id="btn-login">登 录</button>
                <div class="login-error" id="login-error"></div>
                <div class="login-hint">
                    勾选"记住我"保存7天，不勾选保存24小时
                </div>
            </div>
        </div>

        <!-- 管理页 -->
        <div id="admin-app" class="admin-shell" style="display: none">
            <div class="topbar">
                <div class="topbar-left">
                    <div class="topbar-logo">KS</div>
                    <div>
                        <span class="topbar-title">城科卷王管理台</span>
                        <span class="topbar-subtitle">Production</span>
                    </div>
                </div>
                <div class="topbar-right">
                    <button class="tb-btn" aria-label="返回前台首页" onclick="location.href = 'index.html'">访问首页</button>
                    <button class="tb-btn" aria-label="导出用户数据为CSV文件" onclick="Admin.exportCSV()">导出用户 CSV</button>
                    <button class="tb-btn danger" aria-label="退出管理后台登录" onclick="Admin.logout()">退出登录</button>
                </div>
            </div>

            <div class="tabs" id="tabs" role="tablist" aria-label="管理功能导航">
                <div class="tab active" id="tab-overview" role="tab" aria-selected="true" tabindex="0" data-tab="overview" onclick="Admin.switchTab('overview')">
                    总览
                </div>
                <div class="tab" id="tab-users" role="tab" aria-selected="false" tabindex="-1" data-tab="users" onclick="Admin.switchTab('users')">用户管理</div>
                <div class="tab" id="tab-banks" role="tab" aria-selected="false" tabindex="-1" data-tab="banks" onclick="Admin.switchTab('banks')">题库管理</div>
                <div class="tab" id="tab-activity" role="tab" aria-selected="false" tabindex="-1" data-tab="activity" onclick="Admin.switchTab('activity')">
                    活跃记录
                </div>
                <div class="tab" id="tab-announce" role="tab" aria-selected="false" tabindex="-1" data-tab="announce" onclick="Admin.switchTab('announce')">
                    公告管理
                </div>
                <div class="tab" id="tab-ai" role="tab" aria-selected="false" tabindex="-1" data-tab="ai" onclick="Admin.switchTab('ai')">AI 解读</div>
                <div class="tab" id="tab-logs" role="tab" aria-selected="false" tabindex="-1" data-tab="logs" onclick="Admin.switchTab('logs')">操作日志</div>
                <div class="tab" id="tab-client-logs" role="tab" aria-selected="false" tabindex="-1" data-tab="client-logs" onclick="Admin.switchTab('client-logs')">客户端日志</div>
                <div class="tab" id="tab-status" role="tab" aria-selected="false" tabindex="-1" data-tab="status" onclick="Admin.switchTab('status')">系统状态</div>
            </div>

            <div class="main">
                <div class="section active" id="sec-overview" role="tabpanel" aria-labelledby="tab-overview"></div>
                <div class="section" id="sec-users" role="tabpanel" aria-labelledby="tab-users"></div>
                <div class="section" id="sec-banks" role="tabpanel" aria-labelledby="tab-banks"></div>
                <div class="section" id="sec-activity" role="tabpanel" aria-labelledby="tab-activity"></div>
                <div class="section" id="sec-announce" role="tabpanel" aria-labelledby="tab-announce"></div>
                <div class="section" id="sec-ai" role="tabpanel" aria-labelledby="tab-ai"></div>
                <div class="section" id="sec-logs" role="tabpanel" aria-labelledby="tab-logs"></div>
                <div class="section" id="sec-client-logs" role="tabpanel" aria-labelledby="tab-client-logs"></div>
                <div class="section" id="sec-status" role="tabpanel" aria-labelledby="tab-status"></div>
            </div>
        </div>

        <!-- 弹窗挂载点 -->
        <div id="modal-root"></div>

        <script type="module" src="js/admin.js"></script>
        <script>
            setTimeout(function () {
                if (!window.Admin) {
                    document.getElementById('login-page').innerHTML =
                        '<div style="padding:40px;text-align:center;color:#ef4444;max-width:400px;margin:80px auto"><h3>模块加载失败</h3><p style="margin-top:12px;font-size:13px">请打开 F12 控制台查看红色错误</p><p style="margin-top:8px;font-size:12px;color:#888">常见原因：网络问题或浏览器不支持 ES Module</p></div>';
                }
            }, 5000);
        </script>
        <script type="module" src="js/debug.js"></script>
    </body>
</html>
