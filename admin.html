<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>管理后台 - 城科卷王</title>

        <!-- DNS 预解析 -->
        <link rel="dns-prefetch" href="https://ks-api.mutx.ccwu.cc" />
        <link rel="preconnect" href="https://ks-api.mutx.ccwu.cc" crossorigin />
        <link rel="dns-prefetch" href="https://unpkg.com" />

        <link rel="stylesheet" href="css/base.css" />
        <link rel="stylesheet" href="css/admin.css" />
        <script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js" defer></script>
    </head>
    <body>
        <!-- 登录页 -->
        <div class="login-page" id="login-page">
            <div class="login-card">
                <div class="logo-icon">KS</div>
                <div class="login-kicker">Production Admin</div>
                <h2>城科卷王管理台</h2>
                <p>题库、用户与运营数据管理中心</p>
                <div class="input-group">
                    <span class="ic">🔒</span>
                    <input
                        type="password"
                        id="admin-password"
                        placeholder="请输入管理密码"
                        autocomplete="off"
                    />
                </div>
                <div
                    style="
                        display: flex;
                        align-items: center;
                        justify-content: space-between;
                        margin-bottom: 12px;
                    "
                >
                    <label
                        style="
                            display: flex;
                            align-items: center;
                            gap: 6px;
                            font-size: 12px;
                            color: var(--text-secondary);
                            cursor: pointer;
                        "
                    >
                        <input type="checkbox" id="remember-me" checked style="margin: 0" />
                        <span>记住我（7天）</span>
                    </label>
                </div>
                <button class="btn-login" id="btn-login">登 录</button>
                <div class="login-error" id="login-error"></div>
                <div
                    style="
                        font-size: 10px;
                        color: var(--text-tertiary);
                        margin-top: 8px;
                        text-align: center;
                    "
                >
                    勾选"记住我"保存7天，不勾选保存24小时
                </div>
            </div>
        </div>

        <!-- 管理页 -->
        <div id="admin-app" class="admin-shell" style="display: none">
            <div class="topbar">
                <div class="topbar-left">
                    <div class="topbar-logo">KS</div>
                    <div>
                        <span class="topbar-title">城科卷王管理台</span>
                        <span class="topbar-subtitle">Production</span>
                    </div>
                </div>
                <div class="topbar-right">
                    <button class="tb-btn" onclick="location.href = 'index.html'">访问首页</button>
                    <button class="tb-btn" onclick="Admin.exportCSV()">导出用户 CSV</button>
                    <button class="tb-btn danger" onclick="Admin.logout()">退出登录</button>
                </div>
            </div>

            <div class="tabs" id="tabs">
                <div class="tab active" data-tab="overview" onclick="Admin.switchTab('overview')">
                    总览
                </div>
                <div class="tab" data-tab="users" onclick="Admin.switchTab('users')">用户管理</div>
                <div class="tab" data-tab="banks" onclick="Admin.switchTab('banks')">题库管理</div>
                <div class="tab" data-tab="activity" onclick="Admin.switchTab('activity')">
                    活跃记录
                </div>
                <div class="tab" data-tab="announce" onclick="Admin.switchTab('announce')">
                    公告管理
                </div>
            </div>

            <div class="main">
                <div class="section active" id="sec-overview"></div>
                <div class="section" id="sec-users"></div>
                <div class="section" id="sec-banks"></div>
                <div class="section" id="sec-activity"></div>
                <div class="section" id="sec-announce"></div>
            </div>
        </div>

        <!-- 弹窗挂载点 -->
        <div id="modal-root"></div>

        <script type="module" src="js/admin.js"></script>
        <script>
            setTimeout(function () {
                if (!window.Admin) {
                    document.getElementById('login-page').innerHTML =
                        '<div style="padding:40px;text-align:center;color:#ef4444;max-width:400px;margin:80px auto"><h3>模块加载失败</h3><p style="margin-top:12px;font-size:13px">请打开 F12 控制台查看红色错误</p><p style="margin-top:8px;font-size:12px;color:#888">常见原因：网络问题或浏览器不支持 ES Module</p></div>';
                }
            }, 5000);
        </script>
        <script type="module" src="js/debug.js"></script>
    </body>
</html>
