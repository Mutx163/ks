<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>学习分析 - 城科卷王</title>
        
        <!-- DNS 预解析 -->
        <link rel="dns-prefetch" href="https://ks-api.mutx.ccwu.cc">
        <link rel="preconnect" href="https://ks-api.mutx.ccwu.cc" crossorigin>
        <link rel="dns-prefetch" href="https://unpkg.com">

        <!-- Lucide 图标（异步加载，不阻塞页面） -->
        <script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js" async defer></script>

      <script type="module" crossorigin src="/assets/perf-DqLayIAb.js"></script>
      <script type="module" crossorigin src="/assets/bankLoader-DuUKJG19.js"></script>
      <script type="module" crossorigin src="/assets/insights-BrQ339Ep.js"></script>
      <link rel="stylesheet" crossorigin href="/assets/perf-CYdPjB7w.css">
      <link rel="stylesheet" crossorigin href="/assets/insights-DdLszS_Z.css">
    </head>
    <body data-page="analysis">
        <script>history.scrollRestoration='manual';window.scrollTo(0,0);</script>
        <header class="insight-header">
            <div class="container">
                <div class="insight-heading">
                    <a class="btn-header-icon btn-sm" href="index.html" aria-label="返回首页"><i data-lucide="arrow-left" class="icon"></i></a>
                    <div>
                        <h1>学习分析</h1>
                        <p>薄弱知识点、题型掌握与复习压力</p>
                    </div>
                </div>
                <div class="insight-actions">
                    <a class="btn-header btn-sm" href="trend.html">趋势</a>
                    <a class="btn btn-primary btn-sm" href="index.html#bank-grid">刷题</a>
                </div>
            </div>
        </header>

        <main class="insight-main">
            <div class="container">
                <section
                    class="insight-summary"
                    id="analysis-summary"
                    aria-label="分析概览"
                ></section>

                <section class="insight-grid">
                    <div class="insight-panel">
                        <div class="insight-panel-header">
                            <h2>薄弱知识点</h2>
                        </div>
                        <div id="weak-categories"></div>
                    </div>

                    <div class="insight-panel">
                        <div class="insight-panel-header">
                            <h2>题型掌握</h2>
                        </div>
                        <div id="type-analysis"></div>
                    </div>
                </section>

                <section class="insight-panel">
                    <div class="insight-panel-header">
                        <h2>题库分析</h2>
                    </div>
                    <div id="bank-analysis"></div>
                </section>
            </div>
        </main>

        <script>
            // 初始化 Lucide 图标（最多重试 50 次，共 5 秒）
            function initLucide(retries) {
                if (typeof lucide !== 'undefined') {
                    lucide.createIcons();
                } else if ((retries || 0) < 50) {
                    setTimeout(function() { initLucide((retries || 0) + 1); }, 100);
                }
            }
            initLucide(0);
        </script>
        <script defer src="js/debug.js"></script>
        <!-- 51.la 统计 -->
    </body>
</html>
