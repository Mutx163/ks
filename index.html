<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能刷题系统</title>
    
    <!-- KaTeX 数学公式渲染 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    
    <!-- Prism.js 代码高亮 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css">
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-c.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-cpp.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-java.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-javascript.min.js"></script>
    
    <!-- 样式 -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/home.css">
</head>
<body>
    <!-- 头部 -->
    <header class="home-header">
        <div class="container">
            <div class="home-logo">
                <div class="home-logo-icon">Q</div>
                <div class="home-logo-text">
                    <h1>智能刷题系统</h1>
                    <p>多题库 · 间隔重复 · 代码高亮 · 数学公式</p>
                </div>
            </div>
            <div class="home-actions">
                <button class="btn btn-secondary btn-sm" id="btn-history">📋 历史</button>
                <button class="btn btn-primary btn-sm" id="btn-import">📥 导入题库</button>
            </div>
        </div>
    </header>

    <!-- 主内容 -->
    <main class="home-main">
        <div class="container">
            <!-- 题型筛选 + 闪电模式 -->
            <div class="filter-bar">
                <div class="type-filter-bar">
                    <button class="type-filter-btn active" data-type="all" onclick="App.filterByType('all')">全部</button>
                    <button class="type-filter-btn" data-type="single" onclick="App.filterByType('single')">单选</button>
                    <button class="type-filter-btn" data-type="multiple" onclick="App.filterByType('multiple')">多选</button>
                    <button class="type-filter-btn" data-type="judge" onclick="App.filterByType('judge')">判断</button>
                    <button class="type-filter-btn" data-type="fill" onclick="App.filterByType('fill')">填空</button>
                    <button class="type-filter-btn" data-type="code" onclick="App.filterByType('code')">编程</button>
                </div>
                <label class="lightning-toggle" title="闪电模式：点击选项直接判对错，正确自动跳下一题">
                    <input type="checkbox" id="lightning-mode" onchange="App.toggleLightning(this.checked)">
                    <span class="lightning-icon">⚡</span>
                    <span class="lightning-label">闪电</span>
                </label>
            </div>

            <!-- 统计 -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">题库数量</div>
                    <div class="stat-value blue" id="stat-banks">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">总题目数</div>
                    <div class="stat-value" id="stat-questions">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">已答题数</div>
                    <div class="stat-value green" id="stat-answered">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">正确率</div>
                    <div class="stat-value orange" id="stat-accuracy">0%</div>
                </div>
            </div>

            <!-- 今日待复习 -->
            <div id="today-due" style="display: none;"></div>

            <!-- 薄弱知识点 -->
            <div id="weak-categories" style="display: none;"></div>

            <!-- 学习趋势 -->
            <div id="trend-section" style="display: none;"></div>

            <!-- 历史记录（默认隐藏） -->
            <div id="history-section" style="display: none;"></div>

            <!-- 题库 -->
            <section class="section">
                <div class="section-header">
                    <h2 class="section-title">题库列表</h2>
                </div>
                <div class="bank-grid" id="bank-grid">
                    <!-- 动态渲染 -->
                </div>
            </section>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="home-footer">
        <div class="container">
            <p>智能刷题系统 · 间隔重复 · 内置题库 · 支持代码高亮和数学公式</p>
        </div>
    </footer>

    <!-- JavaScript -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
