<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>城科卷王</title>
        <script>window._pageStartTime = Date.now();</script>

        <!-- KaTeX 数学公式渲染 -->
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
        />
        <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

        <!-- Prism.js 代码高亮 -->
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css"
        />
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-c.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-cpp.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-java.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-javascript.min.js"></script>

        <!-- Lucide 图标（异步加载，不阻塞页面） -->
        <script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js" async defer></script>

        <!-- 样式 -->
        <link rel="stylesheet" href="css/base.css" />
        <link rel="stylesheet" href="css/home.css" />
    </head>
    <body>
        <!-- 头部 -->
        <header class="home-header">
            <div class="container">
                <div class="home-logo">
                    <div class="home-logo-text">
                        <h1>城科卷王</h1>
                        <p>多题库 · 间隔重复 · 代码高亮 · 数学公式</p>
                    </div>
                </div>
                <div class="home-actions">
                    <button
                        class="btn btn-ghost btn-sm"
                        id="btn-shortcuts"
                        aria-label="快捷键"
                        title="快捷键参考"
                    >
                        <i data-lucide="keyboard" class="icon"></i>
                    </button>
                    <button
                        class="btn btn-ghost btn-sm"
                        id="btn-theme"
                        aria-label="切换主题"
                        title="切换主题"
                    >
                        <i data-lucide="sun-moon" class="icon"></i>
                    </button>
                    <button
                        class="btn btn-ghost btn-sm"
                        id="btn-settings"
                        aria-label="设置"
                        title="设置"
                    >
                        <i data-lucide="settings" class="icon"></i>
                    </button>
                    <button class="btn btn-secondary btn-sm" id="btn-history" aria-label="答题历史">
                        <i data-lucide="clipboard-list" class="icon"></i> <span>历史</span>
                    </button>
                    <button class="btn btn-accent btn-sm" onclick="location.href='leaderboard.html'" aria-label="排行榜">
                        <i data-lucide="trophy" class="icon"></i> <span>排行</span>
                    </button>
                    <button class="btn btn-ghost btn-sm" id="btn-sync" aria-label="多设备同步" title="多设备同步">
                        <i data-lucide="smartphone" class="icon"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- 主内容 -->
        <main class="home-main">
            <div class="container">
                <!-- 智能头条 -->
                <div id="smart-banner"></div>

                <div class="home-dashboard">
                    <div class="home-primary">
                        <!-- 搜索栏 -->
                        <div class="search-section">
                            <div class="search-input-wrap">
                                <i data-lucide="search" class="search-icon" aria-hidden="true"></i>
                                <input
                                    type="text"
                                    class="search-input"
                                    id="search-input"
                                    placeholder="搜索题目关键词..."
                                    onkeydown="if (event.key === 'Enter') App.searchQuestions();"
                                />
                                <button
                                    class="search-clear"
                                    id="search-clear"
                                    onclick="App.clearSearch()"
                                    aria-label="清除搜索"
                                    style="display: none"
                                >
                                    ✕
                                </button>
                            </div>
                        </div>

                        <!-- 加载骨架屏 -->
                        <div id="loading-skeleton">
                            <div class="skel-hero">
                                <div class="skel-logo-wrap">
                                    <div class="skel-logo-glow">城科卷王</div>
                                    <div class="skel-logo">城科卷王</div>
                                </div>
                                <div class="skel-subtitle">加载中<span class="skel-dots"><i>.</i><i>.</i><i>.</i></span></div>
                            </div>
                        </div>

                        <!-- 题库 -->
                        <section class="section" id="section-banks" style="display:none" aria-label="题库列表">
                            <div class="section-header">
                                <h2 class="section-title">题库列表</h2>
                                <span class="bank-count" id="bank-count"></span>
                            </div>
                            <div class="bank-grid" id="bank-grid">
                                <!-- 动态渲染 -->
                            </div>
                        </section>
                    </div>

                    <aside class="home-secondary" aria-label="学习数据">
                        <!-- 错题本入口 -->
                        <div id="wrong-book"></div>

                        <section class="home-insights-panel" aria-label="学习数据概览">
                            <div class="home-insights-header">
                                <div>
                                    <h2>学习数据</h2>
                                    <p>趋势、分析和当前进度</p>
                                </div>
                                <a href="analysis.html">详情</a>
                            </div>

                            <!-- 趋势/分析入口 -->
                            <div class="insight-entry" aria-label="学习数据入口">
                                <a class="insight-entry-btn" href="trend.html">
                                    <span class="insight-entry-text">
                                        <strong>趋势</strong>
                                        <span>答题节奏</span>
                                    </span>
                                </a>
                                <a class="insight-entry-btn" href="analysis.html">
                                    <span class="insight-entry-text">
                                        <strong>分析</strong>
                                        <span>薄弱点</span>
                                    </span>
                                </a>
                            </div>

                            <!-- 概览统计 -->
                            <div class="stats-overview-section">
                                <div id="tab-overview"></div>
                            </div>
                        </section>

                        <!-- 51.la 数据挂件 -->
                        <section class="home-insights-panel" aria-label="访客统计">
                            <div class="home-insights-header">
                                <div>
                                    <h2>访客统计</h2>
                                    <p>实时访客数据</p>
                                </div>
                            </div>
                            <div id="LA-DATA-WIDGET-CONTAINER"></div>
                        </section>
                    </aside>
                </div>
            </div>
        </main>

        <!-- 页脚 -->
        <footer class="home-footer">
            <div class="container">
                <p>城科卷王 · 间隔重复 · 内置题库 · 支持代码高亮和数学公式</p>
            </div>
        </footer>

        <!-- JavaScript -->
        <script type="module" src="js/app.js"></script>
        <script>
            // 初始化 Lucide 图标
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        </script>
        <!-- 51.la 统计 -->
        <script charset="UTF-8" id="LA_COLLECT" src="//sdk.51.la/js-sdk-pro.min.js"></script>
        <script>LA.init({id:"LCw11fJOoJPF3gGU",ck:"LCw11fJOoJPF3gGU",autoTrack:true})</script>
        <!-- 51.la 数据挂件 -->
        <script id="LA-DATA-WIDGET" crossorigin="anonymous" charset="UTF-8" src="https://v6-widget.51.la/v6/LCw11fJOoJPF3gGU/quote.js?theme=0&col=true&f=12"></script>
        <script>
            // 将 51.la 挂件移动到指定容器
            function moveLAWidget() {
                const widget = document.querySelector('.la-widget.la-data-widget__container');
                const container = document.getElementById('LA-DATA-WIDGET-CONTAINER');
                if (widget && container) {
                    container.appendChild(widget);
                    return true;
                }
                return false;
            }
            // 尝试立即移动，如果失败则使用 MutationObserver 监听（10秒超时）
            if (!moveLAWidget()) {
                const observer = new MutationObserver(function(mutations) {
                    if (moveLAWidget()) {
                        observer.disconnect();
                    }
                });
                observer.observe(document.body, { childList: true, subtree: true });
                setTimeout(function() { observer.disconnect(); }, 10000);
            }
        </script>
        <script src="js/debug.js"></script>
    </body>
</html>
