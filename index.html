<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能刷题系统</title>
    
    <!-- KaTeX 数学公式渲染 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    
    <!-- Prism.js 代码高亮 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css">
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-c.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-cpp.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-java.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-javascript.min.js"></script>
    
    <!-- 样式 -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/home.css">
    
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1P9SBMX5ND"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-1P9SBMX5ND');
    </script>
</head>
<body>
    <!-- 头部 -->
    <header class="home-header">
        <div class="container">
            <div class="home-logo">
                <div class="home-logo-icon">📚</div>
                <div class="home-logo-text">
                    <h1>智能刷题系统</h1>
                    <p>多题库 · 代码支持 · 数学公式</p>
                </div>
            </div>
            <div class="home-actions">
                <button class="btn btn-secondary" onclick="App.showImportModal()">
                    📥 导入题库
                </button>
                <button class="btn btn-ghost" onclick="showSettings()">
                    ⚙️ 设置
                </button>
            </div>
        </div>
    </header>

    <!-- 主内容 -->
    <main class="home-main">
        <div class="container">
            <!-- 统计卡片 -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon blue">📚</div>
                    <div class="stat-info">
                        <h3 id="stat-banks">0</h3>
                        <p>题库数量</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon green">📝</div>
                    <div class="stat-info">
                        <h3 id="stat-questions">0</h3>
                        <p>总题目数</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon orange">✅</div>
                    <div class="stat-info">
                        <h3 id="stat-answered">0</h3>
                        <p>已答题数</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon purple">🎯</div>
                    <div class="stat-info">
                        <h3 id="stat-accuracy">0%</h3>
                        <p>正确率</p>
                    </div>
                </div>
            </div>

            <!-- 题库区域 -->
            <section class="section">
                <div class="section-header">
                    <h2 class="section-title">
                        <span class="section-title-icon">📖</span>
                        我的题库
                    </h2>
                    <button class="btn btn-ghost btn-sm" onclick="App.loadExampleBank('c-language.json')">
                        加载C语言示例
                    </button>
                </div>
                <div class="bank-grid" id="bank-grid">
                    <!-- 动态渲染 -->
                </div>
            </section>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="home-footer">
        <div class="container">
            <p>智能刷题系统 - 支持多题库、代码高亮、数学公式</p>
        </div>
    </footer>

    <!-- 导入弹窗 -->
    <div class="modal-overlay" id="import-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">📥 导入题库</h3>
                <button class="modal-close" onclick="App.closeImportModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="import-zone" id="import-zone" onclick="document.getElementById('import-file').click()">
                    <div class="import-zone-icon">📁</div>
                    <div class="import-zone-title">点击或拖拽文件到此处</div>
                    <div class="import-zone-desc">支持 JSON 格式的题库文件</div>
                    <div class="import-zone-hint">文件格式请参考 <a href="questionbank-schema.md" target="_blank">题库格式规范</a></div>
                </div>
                <input type="file" id="import-file" accept=".json" style="display: none;">
                <div id="import-preview" style="display: none;"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="App.closeImportModal()">取消</button>
                <button class="btn btn-primary" onclick="App.confirmImport()">确认导入</button>
            </div>
        </div>
    </div>

    <!-- 题库详情弹窗 -->
    <div class="modal-overlay" id="bank-detail-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="detail-title">题库详情</h3>
                <button class="modal-close" onclick="App.closeBankDetail()">×</button>
            </div>
            <div class="modal-body" id="detail-body">
                <!-- 动态渲染 -->
            </div>
        </div>
    </div>

    <!-- 设置弹窗 -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">⚙️ 设置</h3>
                <button class="modal-close" onclick="closeSettings()">×</button>
            </div>
            <div class="modal-body">
                <div style="margin-bottom: 20px;">
                    <h4 style="margin-bottom: 12px;">答题设置</h4>
                    <label style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px; cursor: pointer;">
                        <input type="checkbox" id="setting-show-answer" checked>
                        <span>答题后显示答案解析</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px; cursor: pointer;">
                        <input type="checkbox" id="setting-auto-next">
                        <span>答题后自动跳转下一题</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px; cursor: pointer;">
                        <input type="checkbox" id="setting-random-order">
                        <span>默认随机顺序</span>
                    </label>
                </div>
                <div style="margin-bottom: 20px;">
                    <h4 style="margin-bottom: 12px;">数据管理</h4>
                    <div style="display: flex; gap: 12px;">
                        <button class="btn btn-secondary" onclick="exportAllData()">📤 导出数据</button>
                        <button class="btn btn-secondary" onclick="importAllData()">📥 导入数据</button>
                        <button class="btn btn-danger" onclick="clearAllData()">🗑️ 清空数据</button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="saveSettings()">保存设置</button>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="js/storage.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/app.js"></script>
    
    <script>
        // 设置相关函数
        function showSettings() {
            const settings = Storage.getSettings();
            document.getElementById('setting-show-answer').checked = settings.showAnswer;
            document.getElementById('setting-auto-next').checked = settings.autoNext;
            document.getElementById('setting-random-order').checked = settings.randomOrder;
            document.getElementById('settings-modal').classList.add('active');
        }
        
        function closeSettings() {
            document.getElementById('settings-modal').classList.remove('active');
        }
        
        function saveSettings() {
            Storage.updateSettings({
                showAnswer: document.getElementById('setting-show-answer').checked,
                autoNext: document.getElementById('setting-auto-next').checked,
                randomOrder: document.getElementById('setting-random-order').checked
            });
            Utils.showToast('设置已保存', 'success');
            closeSettings();
        }
        
        function exportAllData() {
            const data = Storage.exportData();
            Utils.downloadJSON(data, '刷题系统数据备份.json');
            Utils.showToast('数据已导出', 'success');
        }
        
        function importAllData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (file) {
                    try {
                        const data = await Utils.readJSONFile(file);
                        if (confirm('导入数据将覆盖现有数据，确定继续吗？')) {
                            Storage.importData(data);
                            Utils.showToast('数据已导入', 'success');
                            App.loadData();
                            App.render();
                        }
                    } catch (error) {
                        Utils.showToast(error.message, 'error');
                    }
                }
            };
            input.click();
        }
        
        async function clearAllData() {
            if (confirm('确定要清空所有数据吗？此操作不可恢复！')) {
                if (confirm('再次确认：真的要清空所有数据吗？')) {
                    Storage.clearAll();
                    Utils.showToast('数据已清空', 'success');
                    App.loadData();
                    App.render();
                }
            }
        }
    </script>
</body>
</html>
