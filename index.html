<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" id="meta-theme-color" content="#f9f6ec" />
        <script>
            // 立即恢复主题，防止视觉闪亮屏
            try {
                const settings = JSON.parse(localStorage.getItem('quiz_settings') || '{}');
                const theme = settings.theme || 'auto';
                if (theme !== 'auto') {
                    document.documentElement.setAttribute('data-theme', theme);
                }
            } catch (e) {}
        </script>
        <title>城科卷王</title>
        <script>
            window._pageStartTime = Date.now();
        </script>
        <!-- 早期错误捕获（在模块加载前就开始记录） -->
        <script>
            window._earlyLogs = [];
            window.onerror = function (m, s, l, c, e) {
                window._earlyLogs.push({
                    level: 'error',
                    type: 'uncaught',
                    message: String(m),
                    source: s || '',
                    line: l || 0,
                    col: c || 0,
                    stack: e && e.stack ? e.stack.slice(0, 1000) : '',
                    pageUrl: location.href,
                    ts: new Date().toISOString()
                });
            };
            window.addEventListener('unhandledrejection', function (ev) {
                var r = ev.reason;
                window._earlyLogs.push({
                    level: 'error',
                    type: 'unhandledrejection',
                    message: (r && r.message) || String(r),
                    stack: r && r.stack ? r.stack.slice(0, 1000) : '',
                    pageUrl: location.href,
                    ts: new Date().toISOString()
                });
            });
        </script>

        <!-- DNS 预解析 + 预连接（减少首次请求延迟） -->
        <link rel="dns-prefetch" href="https://ks-api.mutx.ccwu.cc" />
        <link rel="preconnect" href="https://ks-api.mutx.ccwu.cc" crossorigin />
        <link rel="dns-prefetch" href="https://cdn.jsdmirror.com" />

        <!-- 预加载已移除：因为实际请求带 _ts 参数，预加载的请求未被使用 -->

        <!-- Lucide 图标（最先加载，页面需要） -->
        <script
            src="https://cdn.jsdmirror.com/npm/lucide@0.344.0/dist/umd/lucide.min.js"
            defer
        ></script>

        <!-- KaTeX 数学公式（defer，不阻塞骨架屏） -->
        <link
            rel="stylesheet"
            href="https://cdn.jsdmirror.com/npm/katex@0.16.9/dist/katex.min.css"
        />
        <script src="https://cdn.jsdmirror.com/npm/katex@0.16.9/dist/katex.min.js" defer></script>

        <!-- Prism.js 代码高亮（defer，不阻塞骨架屏） -->
        <link
            rel="stylesheet"
            href="https://cdn.jsdmirror.com/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css"
        />
        <script src="https://cdn.jsdmirror.com/npm/prismjs@1.29.0/prism.min.js" defer></script>
        <script
            src="https://cdn.jsdmirror.com/npm/prismjs@1.29.0/components/prism-c.min.js"
            defer
        ></script>
        <script
            src="https://cdn.jsdmirror.com/npm/prismjs@1.29.0/components/prism-cpp.min.js"
            defer
        ></script>
        <script
            src="https://cdn.jsdmirror.com/npm/prismjs@1.29.0/components/prism-java.min.js"
            defer
        ></script>
        <script
            src="https://cdn.jsdmirror.com/npm/prismjs@1.29.0/components/prism-python.min.js"
            defer
        ></script>
        <script
            src="https://cdn.jsdmirror.com/npm/prismjs@1.29.0/components/prism-javascript.min.js"
            defer
        ></script>

        <!-- 样式 -->
        <link rel="stylesheet" href="css/base.css" />
        <link rel="stylesheet" href="css/home.css?v=2" />
        <link rel="stylesheet" href="css/leaderboard.css" />
        <link rel="stylesheet" href="css/insights.css" />
    </head>
    <body>
        <script>
            history.scrollRestoration = 'manual';
            window.scrollTo(0, 0);
        </script>
        <!-- 全屏加载骨架屏 -->
        <div id="loading-skeleton">
            <div class="skel-hero">
                <div class="skel-logo-wrap">
                    <div class="skel-logo-glow">城科卷王</div>
                    <div class="skel-logo">城科卷王</div>
                </div>
                <div class="skel-subtitle">加载中</div>
            </div>
        </div>

        <!-- 头部 -->
        <header class="home-header">
            <div class="container">
                <div class="home-logo">
                    <div class="home-logo-text">
                        <h1>城科卷王</h1>
                        <p>多题库 · 间隔重复 · 代码高亮 · 数学公式</p>
                    </div>
                </div>
                <div class="home-actions">
                    <button
                        class="btn btn-header btn-sm"
                        id="btn-history"
                        aria-label="答题历史"
                        title="答题历史"
                    >
                        <i data-lucide="clipboard-list" class="icon"></i> <span>历史</span>
                    </button>
                    <button
                        class="btn btn-header btn-sm"
                        id="btn-header-leaderboard"
                        onclick="location.hash = '#/leaderboard'"
                        aria-label="排行榜"
                        title="排行榜"
                    >
                        <i data-lucide="trophy" class="icon"></i> <span>排行</span>
                    </button>
                    <div class="header-divider"></div>
                    <button
                        class="btn btn-header-icon btn-sm"
                        id="btn-sync"
                        aria-label="多设备同步"
                        title="多设备同步"
                    >
                        <i data-lucide="smartphone" class="icon"></i>
                    </button>
                    <button
                        class="btn btn-header-icon btn-sm"
                        id="btn-shortcuts"
                        aria-label="快捷键"
                        title="快捷键参考"
                    >
                        <i data-lucide="keyboard" class="icon"></i>
                    </button>
                    <button
                        class="btn btn-header-icon btn-sm"
                        id="btn-theme"
                        aria-label="切换主题"
                        title="切换主题"
                    >
                        <i data-lucide="sun-moon" class="icon"></i>
                    </button>
                    <button
                        class="btn btn-header-icon btn-sm"
                        id="btn-settings"
                        aria-label="设置"
                        title="设置"
                    >
                        <i data-lucide="settings" class="icon"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- 主内容 -->
        <div id="home-view" class="view-wrapper active">
            <main class="home-main">
                <div class="container">
                    <!-- 智能头条 -->
                    <div id="smart-banner"></div>

                    <div class="home-dashboard">
                        <div class="home-primary">
                            <!-- 搜索栏 -->
                            <div class="search-section">
                                <div class="search-input-wrap">
                                    <i
                                        data-lucide="search"
                                        class="search-icon"
                                        aria-hidden="true"
                                    ></i>
                                    <input
                                        type="text"
                                        class="search-input"
                                        id="search-input"
                                        placeholder="搜索题目关键词..."
                                        onkeydown="
                                            if (event.key === 'Enter') App.searchQuestions();
                                        "
                                    />
                                    <button
                                        class="search-clear"
                                        id="search-clear"
                                        onclick="App.clearSearch()"
                                        aria-label="清除搜索"
                                        style="display: none"
                                    >
                                        ✕
                                    </button>
                                </div>
                            </div>

                            <!-- 题库 -->
                            <section
                                class="section"
                                id="section-banks"
                                style="display: none"
                                aria-label="题库列表"
                            >
                                <div class="section-header">
                                    <h2 class="section-title">题库列表</h2>
                                    <div style="display: flex; align-items: center; gap: 8px">
                                        <select
                                            id="bank-sort"
                                            style="
                                                padding: 4px 8px;
                                                border: 1px solid var(--border);
                                                border-radius: var(--radius);
                                                font-size: 12px;
                                                background: var(--bg-card);
                                                color: var(--text);
                                            "
                                            onchange="App.sortBanks(this.value)"
                                        >
                                            <option value="recent">最近使用</option>
                                            <option value="name">名称</option>
                                            <option value="count">题目数</option>
                                            <option value="progress">进度</option>
                                        </select>
                                        <span class="bank-count" id="bank-count"></span>
                                    </div>
                                </div>
                                <div class="bank-grid" id="bank-grid">
                                    <!-- 动态渲染 -->
                                </div>
                            </section>
                        </div>

                        <aside class="home-secondary" aria-label="学习数据">
                            <!-- 错题本入口 -->
                            <div id="wrong-book"></div>

                            <section class="home-insights-panel" aria-label="学习数据概览">
                                <div class="home-insights-header">
                                    <div>
                                        <h2>学习数据</h2>
                                        <p>趋势、分析和当前进度</p>
                                    </div>
                                    <a href="analysis.html">详情</a>
                                </div>

                                <!-- 趋势/分析入口 -->
                                <div class="insight-entry" aria-label="学习数据入口">
                                    <a class="insight-entry-btn" href="trend.html">
                                        <span class="insight-entry-text">
                                            <strong>趋势</strong>
                                            <span>答题节奏</span>
                                        </span>
                                    </a>
                                    <a class="insight-entry-btn" href="analysis.html">
                                        <span class="insight-entry-text">
                                            <strong>分析</strong>
                                            <span>薄弱点</span>
                                        </span>
                                    </a>
                                </div>

                                <!-- 概览统计 -->
                                <div class="stats-overview-section">
                                    <div id="tab-overview"></div>
                                </div>
                            </section>

                            <!-- 自定义学习统计挂件 -->
                            <section
                                class="home-insights-panel custom-stats-panel"
                                aria-label="学习统计"
                                id="custom-stats-panel"
                            >
                                <div class="home-insights-header">
                                    <div>
                                        <h2 class="title-gradient">学习统计</h2>
                                        <p>全站实时数据</p>
                                    </div>
                                </div>
                                <div id="custom-stats-widget">
                                    <div class="custom-stats-grid">
                                        <div class="custom-stat-card">
                                            <div class="custom-stat-value" id="stat-total-active">
                                                0
                                            </div>
                                            <div class="custom-stat-label">活跃人数</div>
                                        </div>
                                        <div class="custom-stat-card">
                                            <div class="custom-stat-value" id="stat-today-active">
                                                0
                                            </div>
                                            <div class="custom-stat-label">今日刷题</div>
                                        </div>
                                    </div>
                                    <div class="recent-active-section">
                                        <h3 class="recent-active-title">🔥 最近活跃人员</h3>
                                        <div class="recent-users-list" id="recent-users-container">
                                            <div class="stats-loading">
                                                <div class="stats-loading-spinner"></div>
                                                <span>加载中...</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </section>
                        </aside>
                    </div>
                </div>
            </main>
        </div>

        <!-- 排行榜视图 -->
        <div id="leaderboard-view" class="view-wrapper">
            <main class="lb-container">
                <div class="lb-header">
                    <h1>🏆 排行榜</h1>
                    <p id="lb-desc">全站学习数据排行</p>
                </div>
                <!-- 当前用户 -->
                <div id="lb-me" style="display: none"></div>
                <!-- Tab 切换 -->
                <div class="lb-tabs">
                    <button
                        class="lb-tab active"
                        data-sort="answered"
                        onclick="LB.switchTab('answered')"
                    >
                        📊 答题数
                    </button>
                    <button class="lb-tab" data-sort="accuracy" onclick="LB.switchTab('accuracy')">
                        🎯 正确率
                    </button>
                    <button class="lb-tab" data-sort="duration" onclick="LB.switchTab('duration')">
                        ⏱ 学习时长
                    </button>
                </div>
                <!-- 排行榜列表 -->
                <div id="lb-list" class="lb-list">
                    <div class="lb-loading">加载中...</div>
                </div>
            </main>
        </div>

        <!-- 学习分析视图 -->
        <div id="analysis-view" class="view-wrapper">
            <main class="insight-main">
                <div class="container">
                    <section
                        class="insight-summary"
                        id="analysis-summary"
                        aria-label="分析概览"
                    ></section>
                    <section class="insight-grid">
                        <div class="insight-panel">
                            <div class="insight-panel-header"><h2>薄弱知识点</h2></div>
                            <div id="weak-categories"></div>
                        </div>
                        <div class="insight-panel">
                            <div class="insight-panel-header"><h2>题型掌握</h2></div>
                            <div id="type-analysis"></div>
                        </div>
                    </section>
                    <section class="insight-panel">
                        <div class="insight-panel-header"><h2>题库分析</h2></div>
                        <div id="bank-analysis"></div>
                    </section>
                </div>
            </main>
        </div>

        <!-- 答题趋势视图 -->
        <div id="trend-view" class="view-wrapper">
            <main class="insight-main">
                <div class="container">
                    <section
                        class="insight-summary"
                        id="trend-summary"
                        aria-label="趋势概览"
                    ></section>
                    <section class="insight-panel">
                        <div class="insight-panel-header">
                            <h2>14 日趋势</h2>
                            <span id="trend-range" class="insight-subtle"></span>
                        </div>
                        <div id="daily-trend"></div>
                    </section>
                    <section class="insight-grid">
                        <div class="insight-panel">
                            <div class="insight-panel-header"><h2>题库表现</h2></div>
                            <div id="bank-trend"></div>
                        </div>
                        <div class="insight-panel">
                            <div class="insight-panel-header"><h2>最近记录</h2></div>
                            <div id="recent-history"></div>
                        </div>
                    </section>
                </div>
            </main>
        </div>

        <!-- 页脚 -->
        <footer class="home-footer">
            <div class="container"></div>
        </footer>

        <!-- JavaScript -->
        <script type="module" src="js/app.js"></script>
        <script type="module" src="js/leaderboard.js"></script>
        <script type="module" src="js/insights.js"></script>
        <script>
            // 初始化 Lucide 图标
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        </script>
        <!-- 51.la 统计（async，不阻塞） -->
        <script charset="UTF-8" id="LA_COLLECT" src="//sdk.51.la/js-sdk-pro.min.js" async></script>
        <script>
            // 等 51.la 加载完再初始化
            function initLA() {
                if (typeof LA !== 'undefined') {
                    LA.init({ id: 'LCw11fJOoJPF3gGU', ck: 'LCw11fJOoJPF3gGU', autoTrack: true });
                }
            }
            document.getElementById('LA_COLLECT').addEventListener('load', initLA);
        </script>

        <script type="module" src="js/debug.js"></script>
    </body>
</html>
