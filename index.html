<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能刷题系统</title>
    
    <!-- KaTeX 数学公式渲染 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    
    <!-- Prism.js 代码高亮 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css">
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-c.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-cpp.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-java.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-javascript.min.js"></script>
    
    <!-- 样式 -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/home.css">
</head>
<body>
    <!-- 头部 -->
    <header class="home-header">
        <div class="container">
            <div class="home-logo">
                <div class="home-logo-icon">Q</div>
                <div class="home-logo-text">
                    <h1>智能刷题系统</h1>
                    <p>多题库 · 代码高亮 · 数学公式</p>
                </div>
            </div>
        </div>
    </header>

    <!-- 主内容 -->
    <main class="home-main">
        <div class="container">
            <!-- 统计 -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">题库数量</div>
                    <div class="stat-value blue" id="stat-banks">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">总题目数</div>
                    <div class="stat-value" id="stat-questions">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">已答题数</div>
                    <div class="stat-value green" id="stat-answered">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">正确率</div>
                    <div class="stat-value orange" id="stat-accuracy">0%</div>
                </div>
            </div>

            <!-- 题库 -->
            <section class="section">
                <div class="section-header">
                    <h2 class="section-title">题库列表</h2>
                </div>
                <div class="bank-grid" id="bank-grid">
                    <!-- 动态渲染 -->
                </div>
            </section>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="home-footer">
        <div class="container">
            <p>智能刷题系统 · 内置题库 · 支持代码高亮和数学公式</p>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="js/storage.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
