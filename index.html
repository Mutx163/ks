<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>智能刷题系统</title>

        <!-- KaTeX 数学公式渲染 -->
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
        />
        <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

        <!-- Prism.js 代码高亮 -->
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css"
        />
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-c.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-cpp.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-java.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-javascript.min.js"></script>

        <!-- Lucide 图标（异步加载，不阻塞页面） -->
        <script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js" async defer></script>

        <!-- 样式 -->
        <link rel="stylesheet" href="css/base.css" />
        <link rel="stylesheet" href="css/home.css" />
    </head>
    <body>
        <!-- 头部 -->
        <header class="home-header">
            <div class="container">
                <div class="home-logo">
                    <div class="home-logo-icon" aria-hidden="true">Q</div>
                    <div class="home-logo-text">
                        <h1>智能刷题系统</h1>
                        <p>多题库 · 间隔重复 · 代码高亮 · 数学公式</p>
                    </div>
                </div>
                <div class="home-actions">
                    <button
                        class="btn btn-ghost btn-sm"
                        id="btn-shortcuts"
                        aria-label="快捷键"
                        title="快捷键参考"
                    >
                        <i data-lucide="keyboard" class="icon"></i>
                    </button>
                    <button
                        class="btn btn-ghost btn-sm"
                        id="btn-theme"
                        aria-label="切换主题"
                        title="切换主题"
                    >
                        <i data-lucide="sun-moon" class="icon"></i>
                    </button>
                    <button
                        class="btn btn-ghost btn-sm"
                        id="btn-settings"
                        aria-label="设置"
                        title="设置"
                    >
                        <i data-lucide="settings" class="icon"></i>
                    </button>
                    <button class="btn btn-secondary btn-sm" id="btn-history" aria-label="答题历史">
                        <i data-lucide="clipboard-list" class="icon"></i> <span>历史</span>
                    </button>
                    <button class="btn btn-primary btn-sm" id="btn-import" aria-label="导入题库">
                        <i data-lucide="upload" class="icon"></i> <span>导入题库</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- 主内容 -->
        <main class="home-main">
            <div class="container">
                <!-- 智能头条 -->
                <div id="smart-banner"></div>

                <div class="home-dashboard">
                    <div class="home-primary">
                        <!-- 搜索栏 -->
                        <div class="search-section">
                            <div class="search-input-wrap">
                                <i data-lucide="search" class="search-icon" aria-hidden="true"></i>
                                <input
                                    type="text"
                                    class="search-input"
                                    id="search-input"
                                    placeholder="搜索题目关键词..."
                                    onkeydown="if (event.key === 'Enter') App.searchQuestions();"
                                />
                                <button
                                    class="search-clear"
                                    id="search-clear"
                                    onclick="App.clearSearch()"
                                    aria-label="清除搜索"
                                    style="display: none"
                                >
                                    ✕
                                </button>
                            </div>
                        </div>

                        <!-- 题库 -->
                        <section class="section" aria-label="题库列表">
                            <div class="section-header">
                                <h2 class="section-title">题库列表</h2>
                                <span class="bank-count" id="bank-count"></span>
                            </div>
                            <div class="bank-grid" id="bank-grid">
                                <!-- 动态渲染 -->
                            </div>
                        </section>
                    </div>

                    <aside class="home-secondary" aria-label="学习数据">
                        <!-- 错题本入口 -->
                        <div id="wrong-book"></div>

                        <section class="home-insights-panel" aria-label="学习数据概览">
                            <div class="home-insights-header">
                                <div>
                                    <h2>学习数据</h2>
                                    <p>趋势、分析和当前进度</p>
                                </div>
                                <a href="analysis.html">详情</a>
                            </div>

                            <!-- 趋势/分析入口 -->
                            <div class="insight-entry" aria-label="学习数据入口">
                                <a class="insight-entry-btn" href="trend.html">
                                    <i data-lucide="trending-up" class="insight-entry-icon" aria-hidden="true"></i>
                                    <span class="insight-entry-text">
                                        <strong>趋势</strong>
                                        <span>答题节奏</span>
                                    </span>
                                </a>
                                <a class="insight-entry-btn" href="analysis.html">
                                    <i data-lucide="bar-chart-3" class="insight-entry-icon" aria-hidden="true"></i>
                                    <span class="insight-entry-text">
                                        <strong>分析</strong>
                                        <span>薄弱点</span>
                                    </span>
                                </a>
                            </div>

                            <!-- 概览统计 -->
                            <div class="stats-overview-section">
                                <div id="tab-overview"></div>
                            </div>
                        </section>
                    </aside>
                </div>
            </div>
        </main>

        <!-- 页脚 -->
        <footer class="home-footer">
            <div class="container">
                <p>智能刷题系统 · 间隔重复 · 内置题库 · 支持代码高亮和数学公式</p>
            </div>
        </footer>

        <!-- JavaScript -->
        <script type="module" src="js/app.js"></script>
        <script>
            // 初始化 Lucide 图标
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        </script>
    </body>
</html>
