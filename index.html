<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能刷题系统</title>

    <!-- KaTeX 数学公式渲染 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <!-- Prism.js 代码高亮 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css">
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-c.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-cpp.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-java.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-javascript.min.js"></script>

    <!-- 样式 -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/home.css">
</head>
<body>
    <!-- 头部 -->
    <header class="home-header">
        <div class="container">
            <div class="home-logo">
                <div class="home-logo-icon" aria-hidden="true">Q</div>
                <div class="home-logo-text">
                    <h1>智能刷题系统</h1>
                    <p>多题库 · 间隔重复 · 代码高亮 · 数学公式</p>
                </div>
            </div>
            <div class="home-actions">
                <button class="btn btn-ghost btn-sm" id="btn-shortcuts" aria-label="快捷键" title="快捷键参考">⌨</button>
                <button class="btn btn-ghost btn-sm" id="btn-theme" aria-label="切换主题" title="切换主题">🌓</button>
                <label class="lightning-toggle" title="闪电模式：点击选项直接判对错，正确自动跳下一题">
                    <input type="checkbox" id="lightning-mode" onchange="App.toggleLightning(this.checked)">
                    <span class="lightning-icon" aria-hidden="true">⚡</span>
                    <span class="lightning-label">闪电</span>
                </label>
                <button class="btn btn-ghost btn-sm" id="btn-settings" aria-label="设置" title="设置">⚙</button>
                <button class="btn btn-secondary btn-sm" id="btn-history" aria-label="答题历史">📋 历史</button>
                <button class="btn btn-primary btn-sm" id="btn-import" aria-label="导入题库">📥 导入题库</button>
            </div>
        </div>
    </header>

    <!-- 主内容 -->
    <main class="home-main">
        <div class="container">
            <!-- 智能头条 -->
            <div id="smart-banner"></div>

            <!-- 统计标签页 -->

            <!-- 统计标签页 -->
            <div id="stats-tabs" class="stats-tabs">
                <div class="stats-tab-bar" role="tablist">
                    <button class="stats-tab active" data-tab="overview" onclick="App.switchTab('overview')" role="tab" aria-selected="true">📊 概览</button>
                </div>
                <div id="tab-overview" class="stats-tab-content active"></div>
                <div id="tab-trend" class="stats-tab-content"></div>
                <div id="tab-analysis" class="stats-tab-content"></div>
                <div id="tab-history" class="stats-tab-content"></div>
            </div>

            <!-- 题库 -->
            <section class="section" aria-label="题库列表">
                <div class="section-header">
                    <h2 class="section-title">题库列表</h2>
                </div>
                <div class="bank-grid" id="bank-grid">
                    <!-- 动态渲染 -->
                </div>
            </section>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="home-footer">
        <div class="container">
            <p>智能刷题系统 · 间隔重复 · 内置题库 · 支持代码高亮和数学公式</p>
        </div>
    </footer>

    <!-- JavaScript -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
