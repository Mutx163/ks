<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>学习分析 - 城科卷王</title>

        <!-- Lucide 图标（异步加载，不阻塞页面） -->
        <script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js" async defer></script>

        <link rel="stylesheet" href="css/base.css" />
        <link rel="stylesheet" href="css/insights.css" />
    </head>
    <body data-page="analysis">
        <header class="insight-header">
            <div class="container">
                <div class="insight-heading">
                    <a class="btn btn-ghost btn-sm" href="index.html" aria-label="返回首页"><i data-lucide="arrow-left" class="icon"></i></a>
                    <div>
                        <h1>学习分析</h1>
                        <p>薄弱知识点、题型掌握与复习压力</p>
                    </div>
                </div>
                <div class="insight-actions">
                    <a class="btn btn-secondary btn-sm" href="trend.html">趋势</a>
                    <a class="btn btn-primary btn-sm" href="index.html#bank-grid">刷题</a>
                </div>
            </div>
        </header>

        <main class="insight-main">
            <div class="container">
                <!-- 51.la 数据挂件 -->
                <section class="insight-panel" style="margin-bottom: var(--space-4)">
                    <div class="insight-panel-header">
                        <h2>访客统计</h2>
                    </div>
                    <div id="LA-DATA-WIDGET-CONTAINER"></div>
                </section>

                <section
                    class="insight-summary"
                    id="analysis-summary"
                    aria-label="分析概览"
                ></section>

                <section class="insight-grid">
                    <div class="insight-panel">
                        <div class="insight-panel-header">
                            <h2>薄弱知识点</h2>
                        </div>
                        <div id="weak-categories"></div>
                    </div>

                    <div class="insight-panel">
                        <div class="insight-panel-header">
                            <h2>题型掌握</h2>
                        </div>
                        <div id="type-analysis"></div>
                    </div>
                </section>

                <section class="insight-panel">
                    <div class="insight-panel-header">
                        <h2>题库分析</h2>
                    </div>
                    <div id="bank-analysis"></div>
                </section>
            </div>
        </main>

        <script type="module" src="js/insights.js"></script>
        <script>
            // 初始化 Lucide 图标
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        </script>
