<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="城科卷王">
  <!-- 品牌标记：深蓝圆角块 + 白色「卷」+ 一个橙点，只保留两个形状，16px 下仍可辨认 -->
  <rect width="64" height="64" rx="14" fill="#155e9c" />
  <text
    x="32"
    y="34"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',system-ui,sans-serif"
    font-size="40"
    font-weight="900"
    fill="#ffffff"
  >卷</text>
  <circle cx="50" cy="14" r="6.5" fill="#b45309" />
</svg>
