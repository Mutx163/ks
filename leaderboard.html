<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>排行榜 - 城科卷王</title>
        <link rel="stylesheet" href="css/base.css" />
        <link rel="stylesheet" href="css/home.css?v=2" />
        <style>
            .lb-container {
                max-width: 800px;
                margin: 60px auto 0;
                padding: var(--space-4);
                animation: lbFadeIn 0.3s ease;
            }
            @keyframes lbFadeIn {
                from { opacity: 0; transform: translateY(8px); }
                to { opacity: 1; transform: translateY(0); }
            }

            /* ---- 头部 ---- */
            .lb-header {
                text-align: center;
                margin-bottom: var(--space-6);
            }
            .lb-header h1 {
                font-size: var(--font-size-2xl);
                font-weight: 700;
                margin-bottom: var(--space-2);
            }
            .lb-header p {
                color: var(--text-secondary);
            }

            /* ---- Tab 药丸切换 ---- */
            .lb-tabs {
                display: flex;
                gap: var(--space-2);
                margin-bottom: var(--space-5);
                background: var(--bg-hover);
                border-radius: 24px;
                padding: 4px;
            }
            .lb-tab {
                flex: 1;
                padding: 10px 16px;
                border-radius: 20px;
                border: none;
                background: transparent;
                color: var(--text-secondary);
                cursor: pointer;
                font-size: var(--font-size-sm);
                font-weight: 500;
                transition: var(--transition);
                white-space: nowrap;
            }
            .lb-tab:hover {
                color: var(--text);
            }
            .lb-tab.active {
                background: var(--bg-card);
                color: var(--primary);
                box-shadow: var(--shadow);
                font-weight: 600;
            }

            /* ---- 当前用户粘性卡片 ---- */
            .lb-me {
                position: sticky;
                top: 0;
                z-index: 10;
                background: linear-gradient(135deg, var(--primary-light) 0%, color-mix(in srgb, var(--primary-light) 70%, white) 100%);
                border: 1px solid var(--primary);
                border-radius: var(--radius-lg);
                padding: var(--space-4) var(--space-5);
                margin-bottom: var(--space-5);
                display: flex;
                align-items: center;
                gap: var(--space-4);
                box-shadow: 0 2px 12px rgba(25, 118, 210, 0.12);
                transition: box-shadow 0.3s ease;
            }
            .lb-me:hover {
                box-shadow: 0 4px 20px rgba(25, 118, 210, 0.18);
            }
            .lb-me-rank {
                font-size: 28px;
                font-weight: 800;
                color: var(--primary);
                min-width: 56px;
                text-align: center;
                font-variant-numeric: tabular-nums;
            }
            .lb-me-info {
                flex: 1;
            }
            .lb-me-name {
                font-weight: 700;
                font-size: var(--font-size-xl);
            }
            .lb-me-stats {
                display: flex;
                gap: var(--space-4);
                margin-top: var(--space-1);
                color: var(--text-secondary);
                font-size: var(--font-size-sm);
                flex-wrap: wrap;
            }
            .lb-me-stat {
                display: inline-flex;
                align-items: center;
                gap: 4px;
            }
            .lb-me-badge {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                padding: 2px 10px;
                border-radius: 12px;
                background: var(--primary);
                color: #fff;
                font-size: 11px;
                font-weight: 600;
            }

            /* ---- 排行榜列表 ---- */
            .lb-list {
                display: flex;
                flex-direction: column;
                gap: var(--space-2);
            }

            .lb-row {
                display: flex;
                align-items: center;
                gap: var(--space-3);
                padding: var(--space-3) var(--space-4);
                background: var(--bg-card);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
                position: relative;
                overflow: hidden;
            }
            .lb-row::before {
                content: '';
                position: absolute;
                left: 0;
                top: 0;
                bottom: 0;
                width: 3px;
                background: transparent;
                transition: background 0.15s ease;
                border-radius: 0 2px 2px 0;
            }
            .lb-row:hover {
                transform: translateX(4px);
                box-shadow: var(--shadow-md);
                border-color: var(--primary);
            }
            .lb-row:hover::before {
                background: var(--primary);
            }
            .lb-row.is-me {
                border-color: var(--primary);
                background: var(--primary-light);
            }
            .lb-row.is-me::before {
                background: var(--primary);
            }

            /* Top 3 行特殊样式 */
            .lb-row.top-1 {
                border-color: #f59e0b;
                background: linear-gradient(135deg, #fffbeb 0%, var(--bg-card) 100%);
            }
            .lb-row.top-2 {
                border-color: #cbd5e1;
                background: linear-gradient(135deg, #f8fafc 0%, var(--bg-card) 100%);
            }
            .lb-row.top-3 {
                border-color: #d4a574;
                background: linear-gradient(135deg, #fff7ed 0%, var(--bg-card) 100%);
            }

            @keyframes rowSlideIn {
                from {
                    opacity: 0;
                    transform: translateY(12px) scale(0.98);
                }
                to {
                    opacity: 1;
                    transform: translateY(0) scale(1);
                }
            }

            .lb-rank {
                font-weight: 700;
                font-size: var(--font-size-sm);
                min-width: 28px;
                height: 28px;
                display: flex;
                align-items: center;
                justify-content: center;
                text-align: center;
                color: #fff;
                background: var(--bg-hover);
                border-radius: 50%;
                flex-shrink: 0;
                font-variant-numeric: tabular-nums;
            }
            .lb-rank.top-1 { background: linear-gradient(135deg, #f59e0b, #fbbf24); }
            .lb-rank.top-2 { background: linear-gradient(135deg, #94a3b8, #cbd5e1); }
            .lb-rank.top-3 { background: linear-gradient(135deg, #cd7f32, #d4a574); }

            .lb-rank.rank-4 { background: #e0e0e0; color: var(--text-secondary); }
            .lb-rank.rank-5 { background: #e0e0e0; color: var(--text-secondary); }
            .lb-rank.rank-6 { background: #e8e8e8; color: var(--text-tertiary); }
            .lb-rank.rank-7 { background: #e8e8e8; color: var(--text-tertiary); }
            .lb-rank.rank-8 { background: #eee; color: var(--text-tertiary); }
            .lb-rank.rank-9 { background: #eee; color: var(--text-tertiary); }
            .lb-rank.rank-10 { background: #f0f0f0; color: var(--text-tertiary); }

            .lb-rank-num {
                font-size: 11px;
                font-weight: 700;
            }

            .lb-avatar {
                width: 36px;
                height: 36px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-weight: 700;
                font-size: var(--font-size-sm);
                flex-shrink: 0;
                color: #fff;
                background: var(--primary);
                box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            }
            .lb-name {
                flex: 1;
                font-weight: 500;
                min-width: 0;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .lb-name-tag {
                font-size: 11px;
                color: var(--primary);
                font-weight: 600;
                margin-left: 6px;
            }
            .lb-value-wrap {
                text-align: right;
                flex-shrink: 0;
            }
            .lb-value {
                font-weight: 700;
                color: var(--text);
                font-variant-numeric: tabular-nums;
                font-size: var(--font-size-base);
            }
            .lb-sub {
                font-size: 11px;
                color: var(--text-tertiary);
                margin-top: 1px;
            }

            /* 进度条（行内） */
            .lb-row-bar {
                position: absolute;
                left: 0;
                bottom: 0;
                height: 2px;
                background: var(--primary-light);
                border-radius: 0 1px 0 0;
                transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            }

            /* ---- 空状态 / 加载 ---- */
            .lb-empty {
                text-align: center;
                padding: var(--space-10) var(--space-4);
                color: var(--text-tertiary);
                background: var(--bg-card);
                border-radius: var(--radius-lg);
                border: 1px dashed var(--border);
            }
            .lb-empty-icon {
                font-size: 48px;
                margin-bottom: var(--space-3);
            }
            .lb-empty-title {
                font-size: var(--font-size-lg);
                font-weight: 600;
                color: var(--text-secondary);
                margin-bottom: var(--space-2);
            }
            .lb-loading {
                text-align: center;
                padding: var(--space-10);
                color: var(--text-secondary);
            }
            .lb-loading-spinner {
                display: inline-block;
                width: 32px;
                height: 32px;
                border: 3px solid var(--border);
                border-top-color: var(--primary);
                border-radius: 50%;
                animation: lbSpin 0.7s linear infinite;
                margin-bottom: var(--space-3);
            }
            @keyframes lbSpin {
                to { transform: rotate(360deg); }
            }

            /* ---- 底部 ---- */
            .lb-footer {
                text-align: center;
                padding: var(--space-6) 0;
                color: var(--text-tertiary);
                font-size: var(--font-size-xs);
            }

            /* ---- 暗色模式适配 ---- */
            @media (prefers-color-scheme: dark) {
                .lb-rank.rank-4 { background: #444; color: var(--text-secondary); }
                .lb-rank.rank-5 { background: #444; color: var(--text-secondary); }
                .lb-rank.rank-6 { background: #3a3a3a; color: var(--text-tertiary); }
                .lb-rank.rank-7 { background: #3a3a3a; color: var(--text-tertiary); }
                .lb-rank.rank-8 { background: #333; color: var(--text-tertiary); }
                .lb-rank.rank-9 { background: #333; color: var(--text-tertiary); }
                .lb-rank.rank-10 { background: #2e2e2e; color: var(--text-tertiary); }
                .lb-me {
                    background: linear-gradient(135deg, var(--primary-light) 0%, rgba(25, 118, 210, 0.08) 100%);
                }
                .lb-row.top-1 {
                    background: linear-gradient(135deg, rgba(245, 158, 11, 0.08) 0%, var(--bg-card) 100%);
                }
                .lb-row.top-2 {
                    background: linear-gradient(135deg, rgba(148, 163, 184, 0.08) 0%, var(--bg-card) 100%);
                }
                .lb-row.top-3 {
                    background: linear-gradient(135deg, rgba(205, 127, 50, 0.08) 0%, var(--bg-card) 100%);
                }
            }
            [data-theme='dark'] .lb-rank.rank-4 { background: #444; color: var(--text-secondary); }
            [data-theme='dark'] .lb-rank.rank-5 { background: #444; color: var(--text-secondary); }
            [data-theme='dark'] .lb-rank.rank-6 { background: #3a3a3a; color: var(--text-tertiary); }
            [data-theme='dark'] .lb-rank.rank-7 { background: #3a3a3a; color: var(--text-tertiary); }
            [data-theme='dark'] .lb-rank.rank-8 { background: #333; color: var(--text-tertiary); }
            [data-theme='dark'] .lb-rank.rank-9 { background: #333; color: var(--text-tertiary); }
            [data-theme='dark'] .lb-rank.rank-10 { background: #2e2e2e; color: var(--text-tertiary); }
            [data-theme='dark'] .lb-me {
                background: linear-gradient(135deg, var(--primary-light) 0%, rgba(25, 118, 210, 0.08) 100%);
            }
            [data-theme='dark'] .lb-row.top-1 {
                background: linear-gradient(135deg, rgba(245, 158, 11, 0.08) 0%, var(--bg-card) 100%);
            }
            [data-theme='dark'] .lb-row.top-2 {
                background: linear-gradient(135deg, rgba(148, 163, 184, 0.08) 0%, var(--bg-card) 100%);
            }
            [data-theme='dark'] .lb-row.top-3 {
                background: linear-gradient(135deg, rgba(205, 127, 50, 0.08) 0%, var(--bg-card) 100%);
            }

            /* ---- 响应式 ---- */
            @media (max-width: 640px) {
                .lb-me {
                    padding: var(--space-3);
                    gap: var(--space-3);
                }
                .lb-me-rank {
                    font-size: 22px;
                    min-width: 40px;
                }
                .lb-me-name {
                    font-size: var(--font-size-base);
                }
                .lb-me-stats {
                    gap: var(--space-2);
                }
                .lb-tab {
                    font-size: 12px;
                    padding: 8px 10px;
                }
            }
        </style>
    </head>
    <body>
        <script>history.scrollRestoration='manual';window.scrollTo(0,0);</script>
        <header class="home-header">
            <div class="container">
                <div class="home-logo">
                    <div class="home-logo-text">
                        <h1>城科卷王</h1>
                        <p>排行榜 · 全站比拼</p>
                    </div>
                </div>
                <div class="home-actions">
                    <button class="btn-header btn-sm" onclick="location.href='index.html'" aria-label="返回首页">
                        <span>首页</span>
                    </button>
                </div>
            </div>
        </header>

        <main class="lb-container">
            <div class="lb-header">
                <h1>🏆 排行榜</h1>
                <p id="lb-desc">全站学习数据排行</p>
            </div>

            <!-- 当前用户 -->
            <div id="lb-me" style="display:none;"></div>

            <!-- Tab 切换 -->
            <div class="lb-tabs">
                <button class="lb-tab active" data-sort="answered" onclick="LB.switchTab('answered')">📊 答题数</button>
                <button class="lb-tab" data-sort="accuracy" onclick="LB.switchTab('accuracy')">🎯 正确率</button>
                <button class="lb-tab" data-sort="duration" onclick="LB.switchTab('duration')">⏱ 学习时长</button>
            </div>

            <!-- 排行榜列表 -->
            <div id="lb-list" class="lb-list">
                <div class="lb-loading">加载中...</div>
            </div>
        </main>

        <footer class="lb-footer">
            <p>城科卷王 · 排行榜</p>
        </footer>

        <script type="module" src="js/leaderboard.js"></script>
        <script defer src="js/debug.js"></script>
    </body>
</html>
