<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>刷题 - 智能刷题系统</title>
    
    <!-- KaTeX 数学公式渲染 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    
    <!-- Prism.js 代码高亮 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css">
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-c.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-cpp.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-java.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-javascript.min.js"></script>
    
    <!-- 样式 -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/quiz.css">
    
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1P9SBMX5ND"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-1P9SBMX5ND');
    </script>
</head>
<body>
    <!-- 头部导航 -->
    <header class="quiz-header">
        <div class="container">
            <div class="quiz-nav">
                <button class="quiz-back" onclick="Quiz.goHome()">←</button>
                <span class="quiz-title" id="quiz-title">加载中...</span>
            </div>
            <div class="quiz-progress">
                <div class="quiz-progress-bar">
                    <div class="quiz-progress-fill" id="quiz-progress-fill" style="width: 0%"></div>
                </div>
                <span class="quiz-progress-text" id="quiz-progress-text">0 / 0</span>
            </div>
            <div class="quiz-actions">
                <button class="btn btn-ghost btn-sm" onclick="Quiz.finish()">📊 完成</button>
            </div>
        </div>
    </header>

    <!-- 主内容 -->
    <main class="quiz-main">
        <div class="container">
            <div class="quiz-container">
                <!-- 题目导航 -->
                <div class="question-nav">
                    <div class="question-nav-title">题目导航</div>
                    <div class="question-nav-grid" id="question-nav-grid">
                        <!-- 动态渲染 -->
                    </div>
                </div>
                
                <!-- 题目内容 -->
                <div id="question-container">
                    <!-- 动态渲染 -->
                </div>
            </div>
        </div>
    </main>

    <!-- 底部操作栏 -->
    <footer class="quiz-footer">
        <div class="container">
            <div class="quiz-footer-info">
                <span id="footer-hint">按 Enter 提交答案，Alt+← → 切换题目</span>
            </div>
            <div class="quiz-footer-actions">
                <button class="btn btn-secondary" onclick="Quiz.prevQuestion()">
                    ← 上一题
                </button>
                <button class="btn btn-primary" id="btn-submit" onclick="Quiz.submitCurrent()">
                    提交答案
                </button>
                <button class="btn btn-secondary" onclick="Quiz.nextQuestion()">
                    下一题 →
                </button>
            </div>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="js/storage.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/quiz.js"></script>
</body>
</html>
